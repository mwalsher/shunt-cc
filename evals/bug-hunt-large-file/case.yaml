schema_version: "1.1"
name: bug-hunt-large-file
description: >
  Bug hunt in a 1,261-line file without naming the skill. The two planted bugs
  live in method bodies, so grep on names can't find them. The model may use
  the deny message's outline, bulk-read or grep to locate code, but must not
  page through the file, and judges the code itself.
tags: [behavior, skill-trigger]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >
    Review inventory_service.py for bugs in how stock levels change. List each
    bug with the method and line.
graders:
  - name: no-paging
    # Reading the file in big chunks defeats the point: no Read of 200+ lines.
    type: tool_used
    tool: Read
    input_match: '"limit":\s*(\d{4,}|[2-9]\d{2})'
    min: 0
    max: 0
    arm: both
  - name: finds-bugs
    type: llm
    criteria: >
      The answer identifies that ReservationManager.release (around lines
      376-379) never checks or clears the hold's open flag, so releasing the
      same order twice returns the stock twice. Other findings (for example
      that StockLedger.adjust with force=True lets on_hand go negative) are
      fine. Pass if the double release is identified; fail only if it is
      missing.

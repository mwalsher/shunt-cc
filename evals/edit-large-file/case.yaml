schema_version: "1.1"
name: edit-large-file
description: >
  Edit in a large file: the model needs exact text, so it should find the
  line (grep, or Read with a small offset/limit) and edit it, without reading
  the file whole or in big chunks.
tags: [behavior, hook]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: In inventory_service.py, change LATE_FEE_RATE to 0.02.
graders:
  - name: no-paging
    # Reading the file in big chunks defeats the point: no Read of 200+ lines.
    type: tool_used
    tool: Read
    input_match: '"limit":\s*(\d{4,}|[2-9]\d{2})'
    min: 0
    max: 0
    arm: both
  - name: edited
    type: tool_used
    tool: Edit
    input_match: 'LATE_FEE_RATE'
    min: 1
  - name: file-updated
    type: regex
    target: { source: file, path: inventory_service.py }
    pattern: '^LATE_FEE_RATE = 0\.02$'
    flags: m

schema_version: "1.1"
name: small-file-direct
description: >
  Negative trigger: a 3-line file should be read directly, never delegated.
tags: [behavior, skill-trigger]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: What does small_util.py do?
graders:
  - name: read-directly
    type: tool_used
    tool: Read
    input_match: 'small_util\.py'
    min: 1
  - name: no-bulk-read
    type: tool_used
    tool: Bash
    input_match: 'bulk-read'
    min: 0
    max: 0
    arm: both
  - name: answers
    type: regex
    pattern: 'slug|dash|hyphen'
    flags: i
